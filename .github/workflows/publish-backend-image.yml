name: Publish backend image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APP_VERSION: 0.1.0
  IMAGE_PLATFORM: linux/amd64

jobs:
  publish:
    name: Build and push backend image
    runs-on: ubuntu-latest

    steps:
      - name: Check out main commit
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: image
        run: |
          image="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "build_time=${build_time}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.IMAGE_PLATFORM }}
          push: true
          tags: ${{ steps.image.outputs.image }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.image.outputs.build_time }}

      - name: Summarize published image
        run: |
          {
            echo "## Backend image published"
            echo ""
            echo "- Image: \`${{ steps.image.outputs.image }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Platform: \`${{ env.IMAGE_PLATFORM }}\`"
            echo "- Build time: \`${{ steps.image.outputs.build_time }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
