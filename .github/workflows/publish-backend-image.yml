name: Publish backend image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APP_VERSION: 0.1.0
  IMAGE_PLATFORM: linux/amd64

jobs:
  publish:
    name: Build and push backend image
    runs-on: ubuntu-24.04

    steps:
      - name: Check out main commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: image
        run: |
          image="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "build_time=${build_time}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.IMAGE_PLATFORM }}
          push: true
          tags: ${{ steps.image.outputs.image }}
          provenance: mode=max
          sbom: true
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.image.outputs.build_time }}

      - name: Summarize published image
        run: |
          {
            echo "## Backend image published"
            echo ""
            echo "- Deployment image: \`${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}\`"
            echo "- Lookup tag: \`${{ steps.image.outputs.image }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Platform: \`${{ env.IMAGE_PLATFORM }}\`"
            echo "- Build time: \`${{ steps.image.outputs.build_time }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
