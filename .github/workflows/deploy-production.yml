name: Deploy production

on:
  workflow_dispatch:
    inputs:
      smoke_mode:
        description: "launch | standard"
        required: true
        type: choice
        options: [launch, standard]
        default: launch

permissions: {}

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  preflight_pr1_rollback_target:
    name: Assert PR 1 is the current rollback target
    runs-on: [self-hosted, algoedgefno-staging]
    if: github.ref == 'refs/heads/main'
    env:
      BASE_URL: ${{ vars.PROD_BASE_URL }}
    steps:
      - name: Read current image and version from VPS state
        id: current
        run: |
          set -euo pipefail
          COMPOSE_ENV="/opt/algoedgefno/compose/.env"
          [[ -r "$COMPOSE_ENV" ]] || { echo "$COMPOSE_ENV unreadable" >&2; exit 1; }

          previous="$(grep -E '^BACKEND_PROD_IMAGE=' "$COMPOSE_ENV" | tail -1 | cut -d= -f2-)"

          version_json="$(curl -fsS "${BASE_URL}/version")"
          actual_commit="$(printf '%s' "$version_json" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("commit_sha",""))')"
          actual_migration="$(printf '%s' "$version_json" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("migration_version",""))')"

          echo "previous=$previous"                       >> "$GITHUB_OUTPUT"
          echo "actual_commit=$actual_commit"             >> "$GITHUB_OUTPUT"
          echo "actual_migration=$actual_migration"       >> "$GITHUB_OUTPUT"

      - name: Assert PR 1 is still the rollback target
        env:
          EXPECTED_PR1_IMAGE: ${{ vars.PR1_IMAGE_DIGEST }}
          EXPECTED_PR1_COMMIT: ${{ vars.PR1_COMMIT_SHA }}
          EXPECTED_PR1_MIGRATION: ${{ vars.PR1_MIGRATION_VERSION }}
          EXPECTED_CANDIDATE_MIGRATION: ${{ vars.PR2_CANDIDATE_MIGRATION_VERSION }}
        run: |
          set -euo pipefail
          previous="${{ steps.current.outputs.previous }}"
          [[ "$previous" == "$EXPECTED_PR1_IMAGE" ]] \
              || { echo "rollback image is $previous, want PR 1 image $EXPECTED_PR1_IMAGE" >&2; exit 1; }
          [[ "${{ steps.current.outputs.actual_commit }}" == "$EXPECTED_PR1_COMMIT" ]] \
              || { echo "running commit not PR 1" >&2; exit 1; }

          m="${{ steps.current.outputs.actual_migration }}"
          if [[ "$m" != "$EXPECTED_PR1_MIGRATION" && "$m" != "$EXPECTED_CANDIDATE_MIGRATION" ]]; then
              echo "migration version $m is neither PR 1 ($EXPECTED_PR1_MIGRATION) nor candidate ($EXPECTED_CANDIDATE_MIGRATION)" >&2
              exit 1
          fi

  deploy-production:
    name: Promote staging image to production VPS
    needs: preflight_pr1_rollback_target
    runs-on: [self-hosted, algoedgefno-staging]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    env:
      PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}

    steps:
      - name: Validate deploy inputs
        run: |
          set -euo pipefail

          if [[ -z "${PROD_BASE_URL}" ]]; then
            echo "PROD_BASE_URL must be configured as a repository variable" >&2
            exit 1
          fi
          if [[ -z "${STAGING_BASE_URL}" ]]; then
            echo "STAGING_BASE_URL must also be configured as a repository variable because prod promotion verifies the currently deployed staging image first" >&2
            exit 1
          fi
          if [[ ! "${PROD_BASE_URL}" =~ ^https://(api\.[A-Za-z0-9.-]+|api-[A-Za-z0-9.-]+|[A-Za-z0-9.-]+\.api\.[A-Za-z0-9.-]+)(:[0-9]{1,5})?$ ]]; then
            echo "PROD_BASE_URL must be an https production API host without a path" >&2
            exit 1
          fi
          if [[ ! "${STAGING_BASE_URL}" =~ ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?$ ]]; then
            echo "STAGING_BASE_URL must be an https host without a path" >&2
            exit 1
          fi
          prod_host="${PROD_BASE_URL#https://}"
          prod_host="${prod_host%%:*}"
          staging_host="${STAGING_BASE_URL#https://}"
          staging_host="${staging_host%%:*}"
          if [[ "${prod_host}" == "${staging_host}" ]]; then
            echo "PROD_BASE_URL and STAGING_BASE_URL must point at different hosts" >&2
            exit 1
          fi

      - name: Promote staging image to production
        id: deploy
        run: |
          set -euo pipefail

          deploy_log="$(mktemp)"
          trap 'rm -f "${deploy_log}"' EXIT

          sudo -n /usr/local/sbin/algoedgefno-deploy-prod \
            --smoke-mode=${{ inputs.smoke_mode }} \
            "${PROD_BASE_URL}" "${STAGING_BASE_URL}" | tee "${deploy_log}"

          promoted_image="$(grep '^PROMOTED_IMAGE=' "${deploy_log}" | tail -1 | cut -d= -f2- || true)"
          promoted_commit="$(grep '^PROMOTED_COMMIT=' "${deploy_log}" | tail -1 | cut -d= -f2- || true)"
          promoted_migration="$(grep '^PROMOTED_MIGRATION=' "${deploy_log}" | tail -1 | cut -d= -f2- || true)"
          previous_prod_image="$(grep '^PREVIOUS_PROD_IMAGE=' "${deploy_log}" | tail -1 | cut -d= -f2- || true)"

          if [[ -z "${promoted_image}" || -z "${promoted_commit}" || -z "${promoted_migration}" || -z "${previous_prod_image}" ]]; then
            echo "deploy wrapper did not emit the expected promotion metadata" >&2
            exit 1
          fi

          {
            echo "promoted_image=${promoted_image}"
            echo "promoted_commit=${promoted_commit}"
            echo "promoted_migration=${promoted_migration}"
            echo "previous_prod_image=${previous_prod_image}"
          } >> "${GITHUB_OUTPUT}"

      - name: Summarize production deployment
        env:
          PROMOTED_IMAGE: ${{ steps.deploy.outputs.promoted_image }}
          PROMOTED_COMMIT: ${{ steps.deploy.outputs.promoted_commit }}
          PROMOTED_MIGRATION: ${{ steps.deploy.outputs.promoted_migration }}
          PREVIOUS_PROD_IMAGE: ${{ steps.deploy.outputs.previous_prod_image }}
        run: |
          {
            echo "## Production deployment"
            echo ""
            echo "- Source staging URL: \`${STAGING_BASE_URL}\`"
            echo "- Production URL: \`${PROD_BASE_URL}\`"
            echo "- Promoted image: \`${PROMOTED_IMAGE}\`"
            echo "- Promoted commit: \`${PROMOTED_COMMIT}\`"
            echo "- Migration version: \`${PROMOTED_MIGRATION}\`"
            echo "- Previous prod image: \`${PREVIOUS_PROD_IMAGE}\`"
            echo "- Smoke mode: \`${{ inputs.smoke_mode }}\`"
            echo "- Promotion path: current \`BACKEND_STAGING_IMAGE\` pinned on the VPS"
            echo "- Result: production smoke checks passed"
          } >> "${GITHUB_STEP_SUMMARY}"
