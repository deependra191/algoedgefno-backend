# CI gate: build, vet, test, arch-lint on PRs to dev/main
name: CI

# The workflow ALWAYS triggers (no paths-ignore on the trigger). Path filtering
# happens inside, via the `changes` job, so the required status check is always
# reported. This is deliberate: a workflow skipped by a trigger-level
# `paths-ignore` reports as perpetually "pending" and blocks merge once CI is a
# required check under branch protection. Here the always-running `ci-required`
# gate job is the single check to mark required — it reports a definite
# pass/fail whether the heavy `ci` job ran or was skipped for a docs-only PR.
on:
  pull_request:
    # `closed` is included so merging/closing a PR enqueues a fast run in the
    # same PR concurrency group, cancelling any stale CI still in flight.
    # The other types are the defaults, restated because specifying `types`
    # would otherwise drop them.
    types: [opened, synchronize, reopened, closed]
    branches:
      - dev
      - main

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decide whether anything beyond markdown changed. Only '**.md' is treated as
  # "docs": .gitignore, .dockerignore, Dockerfile, *.yml workflows and *.sh
  # scripts are all asserted on by the lint steps in `ci`, so any change to them
  # must run the full job even though they are not Go source.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.closed.outputs.code || steps.filter.outputs.code }}
    steps:
      - id: closed
        name: Skip code detection on PR close
        if: github.event.action == 'closed'
        run: echo "code=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: github.event.action != 'closed'
        with:
          fetch-depth: 0
      - id: filter
        name: Detect non-markdown changes
        if: github.event.action != 'closed'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Fail closed: any error aborts this step so the changes job fails
          # rather than silently emitting a code value. The ci-required gate
          # treats a non-success changes job as a hard failure.
          set -euo pipefail

          # Capture the diff first. If git diff fails, set -e aborts the step (the
          # command substitution's non-zero status propagates) — we never fall
          # through to emit a code value off a bad diff.
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"

          # Iterate the stored list rather than piping into `grep -q`: with
          # pipefail, grep -q closing the pipe early SIGPIPEs the writer and the
          # pipeline reports failure even on a match, which would misclassify a
          # mixed PR. A plain shell loop has no such hazard.
          #
          # code=true when any changed file does not end in .md. An empty diff
          # (no changed files) yields a single empty read that is skipped, so
          # code stays false — nothing to build.
          code=false
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              *.md) ;;                 # markdown only — docs, no CI needed
              *) code=true; break ;;   # any non-markdown file requires full CI
            esac
          done <<< "$changed_files"

          echo "code=$code" >> "$GITHUB_OUTPUT"

  ci:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    services:
      timescaledb:
        image: timescale/timescaledb:2.26.4-pg16   # matches docker/docker-compose.yml; required by migration 000003 (TimescaleDB hypertable)
        env:
          POSTGRES_USER: algoedge
          POSTGRES_PASSWORD: algoedge
          POSTGRES_DB: algoedgefno_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U algoedge -d algoedgefno_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      TEST_DATABASE_URL: postgres://algoedge:algoedge@localhost:5432/algoedgefno_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Run migrations (TimescaleDB)
        run: |
          go run -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate \
              -path migrations -database "$TEST_DATABASE_URL" up

      - name: Test
        run: go test ./...

      - name: Install go-arch-lint
        run: go install github.com/fe3dback/go-arch-lint@v1.11.8

      - name: Arch lint
        run: go-arch-lint check

      # --- CI lint: workflow and script invariants (§14) ---

      - name: publish-backend-image.yml auto-deploys staging after publish
        run: |
          grep -q 'auto-deploy-staging:' .github/workflows/publish-backend-image.yml
          grep -q 'group: vps-deploy' .github/workflows/publish-backend-image.yml
          grep -q 'cancel-in-progress: false' .github/workflows/publish-backend-image.yml
          grep -q 'needs: publish' .github/workflows/publish-backend-image.yml
          grep -q "if: github.ref == 'refs/heads/main'" .github/workflows/publish-backend-image.yml
          grep -q '/usr/local/sbin/algoedgefno-deploy-staging' .github/workflows/publish-backend-image.yml
          grep -q '\-\-smoke-mode="\${STAGING_SMOKE_MODE}"' .github/workflows/publish-backend-image.yml

      - name: publish-backend-image.yml does not deploy production
        run: |
          ! grep -E 'algoedgefno-deploy-prod|backend-prod|migrate-prod|BACKEND_PROD_IMAGE|PROD_BASE_URL' .github/workflows/publish-backend-image.yml

      - name: deploy-staging.yml is workflow_dispatch only (no auto-trigger)
        run: |
          ! grep -E '^\s*push:|^\s*pull_request:|^\s*schedule:' .github/workflows/deploy-staging.yml

      - name: deploy-production.yml is workflow_dispatch only (no auto-trigger)
        run: |
          ! grep -E '^\s*push:|^\s*pull_request:|^\s*schedule:' .github/workflows/deploy-production.yml

      - name: no workflow declares algoedgefno-prod runner label
        run: |
          ! grep -rE 'algoedgefno-prod' \
              .github/workflows/publish-backend-image.yml \
              .github/workflows/deploy-staging.yml \
              .github/workflows/deploy-production.yml

      - name: every self-hosted-runner job in publish-backend-image.yml has explicit if github.ref guard
        run: |
          python3 - .github/workflows/publish-backend-image.yml <<'PY'
          import sys, re

          with open(sys.argv[1], encoding="utf-8") as f:
              content = f.read()

          jobs_section = re.search(r'^jobs:(.*)', content, re.DOTALL | re.MULTILINE)
          if not jobs_section:
              print("FAIL: no jobs section found", file=sys.stderr)
              sys.exit(1)

          job_blocks = re.split(r'\n  [a-zA-Z_][a-zA-Z0-9_-]*:\n', '\n' + jobs_section.group(1))
          violations = []
          job_names = re.findall(r'\n  ([a-zA-Z_][a-zA-Z0-9_-]*):\n', '\n' + jobs_section.group(1))

          for name, block in zip(job_names, job_blocks[1:]):
              if 'self-hosted' in block and "github.ref == 'refs/heads/main'" not in block:
                  violations.append(name)

          if violations:
              print(f"FAIL: self-hosted jobs without if: github.ref guard: {violations}", file=sys.stderr)
              sys.exit(1)

          print("PASS: all self-hosted jobs have if: github.ref guard")
          PY

      - name: deploy-staging.yml has no PR1 rollback-target preflight
        run: |
          ! grep -q 'preflight_pr1_rollback_target' .github/workflows/deploy-staging.yml
          ! grep -q 'EXPECTED_CANDIDATE_MIGRATION' .github/workflows/deploy-staging.yml

      - name: deploy-production.yml has no PR1 rollback-target preflight
        run: |
          ! grep -q 'preflight_pr1_rollback_target' .github/workflows/deploy-production.yml
          ! grep -q 'EXPECTED_CANDIDATE_MIGRATION' .github/workflows/deploy-production.yml

      - name: deploy scripts enforce minimum tenant-scoped migration
        run: |
          for script in deploy/scripts/algoedgefno-deploy-staging.sh deploy/scripts/algoedgefno-deploy-prod.sh; do
            grep -q 'readonly MIN_TENANT_SCOPED_MIGRATION_VERSION=16' "$script"
            grep -q 'below minimum tenant-scoped migration' "$script"
          done

      - name: deploy workflows do not reference obsolete PR1 preflight state
        run: |
          for wf in deploy-staging.yml deploy-production.yml; do
            f=".github/workflows/$wf"
            for forbidden in 'PR1_COMMIT_SHA' 'PR1_MIGRATION_VERSION' 'PR1_IMAGE_DIGEST' 'PR2_CANDIDATE_MIGRATION_VERSION'; do
              if grep -qF "$forbidden" "$f"; then
                echo "$wf must not reference obsolete PR1 preflight variable $forbidden" >&2
                exit 1
              fi
            done
          done

      - name: deploy-production.yml has no inputs.image
        run: |
          ! grep -E 'inputs\.image|^\s+image:' .github/workflows/deploy-production.yml

      - name: deploy-staging.yml declares smoke_mode input and passes it to wrapper
        run: |
          grep -q 'smoke_mode' .github/workflows/deploy-staging.yml
          grep -q '\-\-smoke-mode=' .github/workflows/deploy-staging.yml

      - name: deploy-production.yml declares smoke_mode input and passes it to wrapper
        run: |
          grep -q 'smoke_mode' .github/workflows/deploy-production.yml
          grep -q '\-\-smoke-mode=' .github/workflows/deploy-production.yml
          grep -q 'default: standard' .github/workflows/deploy-production.yml
          grep -q 'options: \[launch, standard\]' .github/workflows/deploy-production.yml

      - name: smoke-prod-launch.sh makes no /auth call
        run: |
          ! grep -E '/auth/' scripts/smoke-prod-launch.sh

      - name: smoke-prod.sh has no TEST_UID_* reference
        run: |
          ! grep -E 'TEST_UID_' scripts/smoke-prod.sh

      - name: smoke-prod.sh has no staging-only or seed-conflict-fixture reference
        run: |
          ! grep -E 'staging.only|seed.conflict.fixture' scripts/smoke-prod.sh

      - name: abuse-suite prod path references no Firebase session/logout mutation or staging-only paths
        run: |
          python3 - scripts/security/abuse-suite.sh <<'PY'
          import sys, re

          path = sys.argv[1]
          with open(path, encoding="utf-8") as f:
              content = f.read()

          # Find the else branch (prod path) block.
          # The prod block is between "else" and final "fi" of the main if/else.
          # We look for the prod-tagged comment and extract to end of else block.
          prod_match = re.search(
              r'#\s*Production path.*?(?=run_finished_at)',
              content, re.DOTALL
          )
          if not prod_match:
              print("FAIL: could not locate production path block in abuse-suite.sh", file=sys.stderr)
              sys.exit(1)

          prod_block = prod_match.group(0)

          # Scan executable code only — drop shell comment lines so a descriptive
          # comment (e.g. "no staging-only paths") cannot trip the pattern check.
          prod_code = "\n".join(
              ln for ln in prod_block.splitlines() if not ln.lstrip().startswith("#")
          )

          forbidden = [
              r'AUTH_SESSION_PATH',
              r'AUTH_LOGOUT_PATH',
              r'firebase_id_token_for_uid',
              r'staging.only',
              r'seed.conflict.fixture',
              r'firebase-token',
          ]
          violations = []
          for pattern in forbidden:
              if re.search(pattern, prod_code, re.IGNORECASE):
                  violations.append(pattern)

          if violations:
              print(f"FAIL: prod block references forbidden patterns: {violations}", file=sys.stderr)
              sys.exit(1)

          print("PASS: prod block is clean")
          PY

      - name: Dockerfile copies scripts
        run: |
          grep -q 'COPY scripts /app/scripts' Dockerfile

      - name: Dockerfile has no broad context copy (COPY . .)
        run: |
          if grep -nE '^[[:space:]]*COPY[[:space:]]+(--[A-Za-z0-9=._-]+[[:space:]]+)*\.[[:space:]]' Dockerfile; then
            echo "Dockerfile must not use a broad 'COPY . .' context copy; copy explicit source paths instead so credential-like files cannot enter the build context/cache" >&2
            exit 1
          fi

      - name: credential-JSON ignore patterns present in .dockerignore and .gitignore
        run: |
          patterns=(
            '*serviceaccount*.json'
            '*service-account*.json'
            '*service_account*.json'
            '*firebase-adminsdk*.json'
            '*google-credentials*.json'
            '*credentials*.json'
          )
          rc=0
          for f in .dockerignore .gitignore; do
            for p in "${patterns[@]}"; do
              if ! grep -qxF "$p" "$f"; then
                echo "missing credential-JSON ignore pattern '$p' in $f" >&2
                rc=1
              fi
            done
          done
          exit "$rc"

      - name: staging-only files live under scripts/staging-only/
        run: |
          test -f scripts/staging-only/seed-conflict-fixture.sh

      - name: "deploy-staging.yml does not declare environment:"
        run: |
          ! grep -E '^\s+environment:\s*(staging|production)' .github/workflows/deploy-staging.yml

      - name: "deploy-production.yml does not declare environment:"
        run: |
          ! grep -E '^\s+environment:\s*(staging|production)' .github/workflows/deploy-production.yml

      - name: every self-hosted-runner job in deploy-staging.yml has explicit if github.ref guard
        run: |
          python3 - .github/workflows/deploy-staging.yml <<'PY'
          import sys, re

          with open(sys.argv[1], encoding="utf-8") as f:
              content = f.read()

          # Find all jobs that run on self-hosted runners.
          jobs_section = re.search(r'^jobs:(.*)', content, re.DOTALL | re.MULTILINE)
          if not jobs_section:
              print("FAIL: no jobs section found", file=sys.stderr)
              sys.exit(1)

          job_blocks = re.split(r'\n  [a-zA-Z_][a-zA-Z0-9_-]*:\n', '\n' + jobs_section.group(1))
          violations = []
          job_names = re.findall(r'\n  ([a-zA-Z_][a-zA-Z0-9_-]*):\n', '\n' + jobs_section.group(1))

          for name, block in zip(job_names, job_blocks[1:]):
              if 'self-hosted' in block and 'github.ref' not in block:
                  violations.append(name)

          if violations:
              print(f"FAIL: self-hosted jobs without if: github.ref guard: {violations}", file=sys.stderr)
              sys.exit(1)

          print("PASS: all self-hosted jobs have if: github.ref guard")
          PY

      - name: every self-hosted-runner job in deploy-production.yml has explicit if github.ref guard
        run: |
          python3 - .github/workflows/deploy-production.yml <<'PY'
          import sys, re

          with open(sys.argv[1], encoding="utf-8") as f:
              content = f.read()

          jobs_section = re.search(r'^jobs:(.*)', content, re.DOTALL | re.MULTILINE)
          if not jobs_section:
              print("FAIL: no jobs section found", file=sys.stderr)
              sys.exit(1)

          job_blocks = re.split(r'\n  [a-zA-Z_][a-zA-Z0-9_-]*:\n', '\n' + jobs_section.group(1))
          violations = []
          job_names = re.findall(r'\n  ([a-zA-Z_][a-zA-Z0-9_-]*):\n', '\n' + jobs_section.group(1))

          for name, block in zip(job_names, job_blocks[1:]):
              if 'self-hosted' in block and 'github.ref' not in block:
                  violations.append(name)

          if violations:
              print(f"FAIL: self-hosted jobs without if: github.ref guard: {violations}", file=sys.stderr)
              sys.exit(1)

          print("PASS: all self-hosted jobs have if: github.ref guard")
          PY

      - name: cmd/sync/main.go does not import internal/firebaseauth
        run: |
          ! grep -q 'internal/firebaseauth' cmd/sync/main.go

  # Single required status check. Always runs and reports a definite pass/fail,
  # so branch protection is never left pending. Mark THIS job ("ci-required")
  # required in branch protection — not "ci", which is skipped for docs-only PRs.
  ci-required:
    needs: [changes, ci]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify CI result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CI_RESULT: ${{ needs.ci.result }}
        run: |
          set -euo pipefail

          # Fail closed on the detector. ci is gated on changes.outputs.code, so a
          # failed/cancelled changes job would leave ci "skipped" too — and a bare
          # ci==skipped check would wrongly pass. The gate therefore requires the
          # detector to have succeeded before it will accept a skipped ci.
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "CI gate failed: changes detector did not succeed (result: $CHANGES_RESULT)" >&2
            exit 1
          fi

          # With a successful detector, ci=skipped means a docs-only PR (accepted)
          # and ci=success means the heavy job ran clean. failure, cancelled, or
          # anything unexpected fails the gate.
          if [ "$CI_RESULT" = "success" ] || [ "$CI_RESULT" = "skipped" ]; then
            echo "CI gate passed (changes: $CHANGES_RESULT, ci: $CI_RESULT)"
            exit 0
          fi
          echo "CI gate failed (changes: $CHANGES_RESULT, ci: $CI_RESULT)" >&2
          exit 1
