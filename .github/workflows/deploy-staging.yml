name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Digest-qualified backend image, for example ghcr.io/deependra191/algoedgefno-backend@sha256:<digest>"
        required: true
        type: string

permissions: {}

concurrency:
  group: staging-vps-deploy
  cancel-in-progress: false

env:
  IMAGE_PREFIX: "ghcr.io/deependra191/algoedgefno-backend@sha256:"

jobs:
  deploy-staging:
    name: Deploy image to staging VPS
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 15
    env:
      DEPLOY_IMAGE: ${{ inputs.image }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_DEPLOY_USER: ${{ secrets.VPS_DEPLOY_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}

    steps:
      - name: Validate deployment inputs
        run: |
          set -euo pipefail

          case "${DEPLOY_IMAGE}" in
            "${IMAGE_PREFIX}"*) ;;
            *)
              echo "image must start with ${IMAGE_PREFIX}" >&2
              exit 1
              ;;
          esac
          if [[ ! "${DEPLOY_IMAGE}" =~ ^ghcr\.io/deependra191/algoedgefno-backend@sha256:[0-9a-f]{64}$ ]]; then
            echo "image must be a digest-qualified GHCR reference with a 64-character sha256 digest" >&2
            exit 1
          fi

          if [[ -z "${VPS_HOST}" || -z "${VPS_DEPLOY_USER}" || -z "${VPS_SSH_PRIVATE_KEY}" || -z "${VPS_KNOWN_HOSTS}" ]]; then
            echo "VPS_HOST, VPS_DEPLOY_USER, VPS_SSH_PRIVATE_KEY, and VPS_KNOWN_HOSTS must be configured" >&2
            exit 1
          fi
          if [[ ! "${VPS_DEPLOY_USER}" =~ ^[a-z_][a-z0-9_-]*[$]?$ ]]; then
            echo "VPS_DEPLOY_USER has an invalid format" >&2
            exit 1
          fi
          if [[ ! "${VPS_HOST}" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "VPS_HOST must be a hostname or IP address without shell metacharacters" >&2
            exit 1
          fi
          if [[ ! "${VPS_SSH_PORT}" =~ ^[0-9]{1,5}$ ]]; then
            echo "VPS_SSH_PORT must be numeric" >&2
            exit 1
          fi

          if [[ -z "${STAGING_BASE_URL}" ]]; then
            echo "STAGING_BASE_URL must be configured" >&2
            exit 1
          fi
          if [[ ! "${STAGING_BASE_URL}" =~ ^https://(staging-api\.[A-Za-z0-9.-]+|staging-[A-Za-z0-9.-]+|[A-Za-z0-9.-]+\.staging\.[A-Za-z0-9.-]+)(:[0-9]{1,5})?$ ]]; then
            echo "STAGING_BASE_URL must be an https staging host without a path" >&2
            exit 1
          fi

      - name: Configure SSH
        run: |
          set -euo pipefail

          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${VPS_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/deploy_key"
          printf '%s\n' "${VPS_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/deploy_key" "${HOME}/.ssh/known_hosts"

      - name: Deploy staging image
        run: |
          set -euo pipefail

          ssh \
            -i "${HOME}/.ssh/deploy_key" \
            -p "${VPS_SSH_PORT}" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${VPS_DEPLOY_USER}@${VPS_HOST}" \
            sudo -n /usr/local/sbin/algoedgefno-deploy-staging "${DEPLOY_IMAGE}" "${STAGING_BASE_URL}"

      - name: Summarize staging deployment
        run: |
          {
            echo "## Staging deployment"
            echo ""
            echo "- Image: \`${DEPLOY_IMAGE}\`"
            echo "- Staging URL: \`${STAGING_BASE_URL}\`"
            echo "- Result: smoke checks passed"
          } >> "${GITHUB_STEP_SUMMARY}"
