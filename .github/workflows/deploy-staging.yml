name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Digest-qualified backend image, for example ghcr.io/deependra191/algoedgefno-backend@sha256:<digest>"
        required: true
        type: string

permissions: {}

concurrency:
  group: staging-vps-deploy
  cancel-in-progress: false

env:
  IMAGE_PREFIX: "ghcr.io/deependra191/algoedgefno-backend@sha256:"
  COMPOSE_DIR: /opt/algoedgefno/compose

jobs:
  deploy-staging:
    name: Deploy image to staging VPS
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 15
    env:
      DEPLOY_IMAGE: ${{ inputs.image }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_DEPLOY_USER: ${{ secrets.VPS_DEPLOY_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}

    steps:
      - name: Validate deployment inputs
        run: |
          set -euo pipefail

          case "${DEPLOY_IMAGE}" in
            "${IMAGE_PREFIX}"*) ;;
            *)
              echo "image must start with ${IMAGE_PREFIX}" >&2
              exit 1
              ;;
          esac
          if [[ ! "${DEPLOY_IMAGE}" =~ ^ghcr\.io/deependra191/algoedgefno-backend@sha256:[0-9a-f]{64}$ ]]; then
            echo "image must be a digest-qualified GHCR reference with a 64-character sha256 digest" >&2
            exit 1
          fi

          if [[ -z "${VPS_HOST}" || -z "${VPS_DEPLOY_USER}" || -z "${VPS_SSH_PRIVATE_KEY}" || -z "${VPS_KNOWN_HOSTS}" ]]; then
            echo "VPS_HOST, VPS_DEPLOY_USER, VPS_SSH_PRIVATE_KEY, and VPS_KNOWN_HOSTS must be configured" >&2
            exit 1
          fi

          if [[ -z "${STAGING_BASE_URL}" ]]; then
            echo "STAGING_BASE_URL must be configured" >&2
            exit 1
          fi

          case "${STAGING_BASE_URL}" in
            https://*) ;;
            *)
              echo "STAGING_BASE_URL must start with https://" >&2
              exit 1
              ;;
          esac

      - name: Configure SSH
        run: |
          set -euo pipefail

          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${VPS_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/deploy_key"
          printf '%s\n' "${VPS_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/deploy_key" "${HOME}/.ssh/known_hosts"

      - name: Deploy staging image
        run: |
          set -euo pipefail

          ssh \
            -i "${HOME}/.ssh/deploy_key" \
            -p "${VPS_SSH_PORT}" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${VPS_DEPLOY_USER}@${VPS_HOST}" \
            'bash -s' -- "${DEPLOY_IMAGE}" "${STAGING_BASE_URL}" "${COMPOSE_DIR}" <<'REMOTE'
          set -euo pipefail

          deploy_image="$1"
          staging_base_url="${2%/}"
          compose_dir="$3"
          env_file="${compose_dir}/.env"
          image_prefix="ghcr.io/deependra191/algoedgefno-backend@sha256:"
          staging_container="algoedgefno-backend-staging"

          fail() {
              printf 'FAIL %s\n' "$1" >&2
              exit 1
          }

          pass() {
              printf 'PASS %s\n' "$1"
          }

          status_code() {
              local name="$1"
              local want="$2"
              local url="$3"
              local code

              code="$(curl -sS -o /dev/null -w '%{http_code}' "${url}" || true)"
              if [[ "${code}" != "${want}" ]]; then
                  fail "${name}: got HTTP ${code}, want ${want}"
              fi
              pass "${name}: HTTP ${want}"
          }

          case "${deploy_image}" in
              "${image_prefix}"*) ;;
              *) fail "image must start with ${image_prefix}" ;;
          esac
          if [[ ! "${deploy_image}" =~ ^ghcr\.io/deependra191/algoedgefno-backend@sha256:[0-9a-f]{64}$ ]]; then
              fail "image must be a digest-qualified GHCR reference with a 64-character sha256 digest"
          fi

          case "${staging_base_url}" in
              https://*) ;;
              *) fail "staging base URL must start with https://" ;;
          esac

          command -v curl >/dev/null 2>&1 || fail "missing curl on VPS"
          command -v docker >/dev/null 2>&1 || fail "missing docker on VPS"
          sudo -n test -f "${env_file}" || fail "${env_file} is missing or not readable"
          sudo -n grep -q '^BACKEND_PROD_IMAGE=' "${env_file}" || fail "BACKEND_PROD_IMAGE must already be set; production image was not modified"

          tmp_env="$(mktemp)"
          cleanup() {
              rm -f "${tmp_env}"
          }
          trap cleanup EXIT

          sudo -n awk -v image="${deploy_image}" '
              BEGIN { updated = 0 }
              /^BACKEND_STAGING_IMAGE=/ {
                  print "BACKEND_STAGING_IMAGE=" image
                  updated = 1
                  next
              }
              { print }
              END {
                  if (updated == 0) {
                      print "BACKEND_STAGING_IMAGE=" image
                  }
              }
          ' "${env_file}" > "${tmp_env}"
          sudo -n install -o root -g root -m 600 "${tmp_env}" "${env_file}"

          cd "${compose_dir}"
          sudo -n docker compose pull backend-staging
          sudo -n docker compose --profile staging up -d backend-staging

          status_code health 200 "${staging_base_url}/health"
          status_code ready 200 "${staging_base_url}/ready"
          status_code version 200 "${staging_base_url}/version"
          status_code protected-no-token 401 "${staging_base_url}/api/v1/config/app"

          actual_image="$(sudo -n docker inspect "${staging_container}" --format '{{.Config.Image}}')"
          if [[ "${actual_image}" != "${deploy_image}" ]]; then
              fail "container image: got ${actual_image}, want ${deploy_image}"
          fi
          pass "container image: ${deploy_image}"

          printf 'staging deploy passed for %s\n' "${deploy_image}"
          REMOTE

      - name: Summarize staging deployment
        run: |
          {
            echo "## Staging deployment"
            echo ""
            echo "- Image: \`${DEPLOY_IMAGE}\`"
            echo "- Staging URL: \`${STAGING_BASE_URL}\`"
            echo "- Result: smoke checks passed"
          } >> "${GITHUB_STEP_SUMMARY}"
