services:
  postgres:
    image: timescale/timescaledb:2.26.4-pg16
    container_name: algoedgefno_postgres
    environment:
      POSTGRES_USER: algoedge
      POSTGRES_PASSWORD: algoedge
      POSTGRES_DB: algoedgefno
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
