version: 3

workdir: .

allow:
  depOnAnyVendor: false
  # deepScan tracks concrete type flow through DI constructors — it fires on
  # composition-root wiring (cmd/*, routes) where storage.X values are passed
  # to service constructors that accept models.X interfaces. The import graph
  # is enforced by the component rules; deep scan creates false positives here.
  deepScan: false

excludeFiles:
  # External test packages (package middleware_test, package logging_test)
  # legitimately import the package they test. go-arch-lint reports this as
  # a component self-import. Exclude these specific test files only — other
  # rules (vendor allowance, cross-component imports) remain enforced via
  # the rest of the project structure.
  - ".*/internal/middleware/.*_test\\.go$"
  - ".*/internal/logging/.*_test\\.go$"

components:
  models:
    in: internal/models
  entities:
    in: internal/entities
  engine:
    in: internal/engine
  storage:
    in: internal/storage
  providers:
    in: internal/providers
  nse:
    in: internal/providers/nse
  vendor_stub:
    in: internal/providers/vendor
  services:
    in: internal/services
  handlers:
    in: internal/handlers
  middleware:
    in: internal/middleware
  config:
    in: internal/config
  database:
    in: internal/database
  routes:
    in: internal/routes
  buildinfo:
    in: internal/buildinfo
  csvutil:
    in: internal/csvutil
  logging:
    in: internal/logging
  strategies:
    in: internal/strategies
  cmd_server:
    in: cmd/server
  cmd_sync:
    in: cmd/sync

deps:
  models:
    anyVendorDeps: true

  entities:
    anyVendorDeps: true

  engine:
    mayDependOn:
      - models
    anyVendorDeps: true

  storage:
    mayDependOn:
      - models
      - entities
    anyVendorDeps: true

  providers:
    mayDependOn:
      - models
    anyVendorDeps: true

  nse:
    mayDependOn:
      - models
      - providers
      - csvutil
    anyVendorDeps: true

  vendor_stub:
    mayDependOn:
      - models
      - providers
    anyVendorDeps: true

  services:
    mayDependOn:
      - models
      - config
    anyVendorDeps: true

  handlers:
    mayDependOn:
      - models
      - services
      - buildinfo
      - config
    anyVendorDeps: true

  middleware:
    mayDependOn:
      - models
      - services
    anyVendorDeps: true

  config:
    anyVendorDeps: true

  database:
    mayDependOn:
      - config
    anyVendorDeps: true

  routes:
    mayDependOn:
      - config
      - database
      - models
      - storage
      - providers
      - nse
      - vendor_stub
      - services
      - handlers
      - middleware
      - engine
      - strategies
    anyVendorDeps: true

  buildinfo:
    anyVendorDeps: true

  logging:
    mayDependOn:
      - config
    anyVendorDeps: true

  csvutil:
    anyVendorDeps: true

  strategies:
    mayDependOn:
      - models
    anyVendorDeps: true

  cmd_server:
    anyProjectDeps: true
    anyVendorDeps: true

  cmd_sync:
    anyProjectDeps: true
    anyVendorDeps: true
