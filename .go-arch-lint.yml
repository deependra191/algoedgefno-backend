version: 3

workdir: .

allow:
  depOnAnyVendor: false
  # deepScan tracks concrete type flow through DI constructors — it fires on
  # composition-root wiring (cmd/*, routes) where storage.X values are passed
  # to service constructors that accept models.X interfaces. The import graph
  # is enforced by the component rules; deep scan creates false positives here.
  deepScan: false

excludeFiles:
  # External test packages legitimately import the package they test.
  # go-arch-lint reports this as a component self-import. Exclude these
  # specific test files only — other rules remain enforced.
  - ".*/internal/middleware/.*_test\\.go$"
  - ".*/internal/logging/.*_test\\.go$"
  - ".*/internal/firebasefixture/.*_test\\.go$"
  # tenant_isolation_test.go is an integration test in package handlers that
  # wires up routes/storage/providers — it is the composition root for the
  # test and must import those packages. Exclude it from arch-lint; the
  # runtime import graph is enforced by the rest of the component rules.
  - ".*/internal/handlers/tenant_isolation_test\\.go$"
  # Worktree directories used by Claude Code and Codex agents — not part of
  # the project being linted.
  - ".*\\.claire/.*"
  - ".*\\.claude/.*"
  - ".*\\.codex/.*"

components:
  models:
    in: internal/models
  entities:
    in: internal/entities
  engine:
    in: internal/engine
  storage:
    in: internal/storage
  providers:
    in: internal/providers
  nse:
    in: internal/providers/nse
  vendor_stub:
    in: internal/providers/vendor
  services:
    in: internal/services
  handlers:
    in: internal/handlers
  middleware:
    in: internal/middleware
  config:
    in: internal/config
  database:
    in: internal/database
  routes:
    in: internal/routes
  buildinfo:
    in: internal/buildinfo
  csvutil:
    in: internal/csvutil
  logging:
    in: internal/logging
  strategies:
    in: internal/strategies
  firebaseauth:
    in: internal/firebaseauth
  firebasefixture:
    in: internal/firebasefixture
  cmd_server:
    in: cmd/server
  cmd_sync:
    in: cmd/sync
  cmd_firebase_token:
    in: cmd/firebase-token
  cmd_setup_firebase_test_users:
    in: cmd/setup-firebase-test-users
  cmd_teardown_firebase_test_users:
    in: cmd/teardown-firebase-test-users
  cmd_verify_prod_smoke_user:
    in: cmd/verify-prod-smoke-user
  cmd_healthcheck:
    in: cmd/healthcheck
  local_rnd:
    in: local-rnd/**

deps:
  models:
    anyVendorDeps: true

  entities:
    anyVendorDeps: true

  engine:
    mayDependOn:
      - models
    anyVendorDeps: true

  storage:
    mayDependOn:
      - models
      - entities
    anyVendorDeps: true

  providers:
    mayDependOn:
      - models
    anyVendorDeps: true

  nse:
    mayDependOn:
      - models
      - providers
      - csvutil
    anyVendorDeps: true

  vendor_stub:
    mayDependOn:
      - models
      - providers
    anyVendorDeps: true

  services:
    mayDependOn:
      - models
      - config
    anyVendorDeps: true

  handlers:
    mayDependOn:
      - models
      - services
      - buildinfo
      - config
    anyVendorDeps: true

  middleware:
    mayDependOn:
      - models
    anyVendorDeps: true

  config:
    anyVendorDeps: true

  database:
    mayDependOn:
      - config
    anyVendorDeps: true

  routes:
    mayDependOn:
      - config
      - database
      - models
      - storage
      - providers
      - nse
      - vendor_stub
      - services
      - handlers
      - middleware
      - engine
      - strategies
    anyVendorDeps: true

  buildinfo:
    anyVendorDeps: true

  logging:
    mayDependOn:
      - config
    anyVendorDeps: true

  csvutil:
    anyVendorDeps: true

  strategies:
    mayDependOn:
      - models
    anyVendorDeps: true

  firebaseauth:
    mayDependOn:
      - models
    anyVendorDeps: true


  cmd_server:
    anyProjectDeps: true
    anyVendorDeps: true

  cmd_sync:
    anyProjectDeps: true
    anyVendorDeps: true

  cmd_firebase_token:
    anyProjectDeps: true
    anyVendorDeps: true

  cmd_setup_firebase_test_users:
    anyProjectDeps: true
    anyVendorDeps: true

  cmd_teardown_firebase_test_users:
    anyProjectDeps: true
    anyVendorDeps: true

  cmd_verify_prod_smoke_user:
    anyProjectDeps: true
    anyVendorDeps: true

  # The healthcheck probe is deliberately dependency-free (stdlib only). It is
  # intentionally NOT granted anyProjectDeps, so arch-lint enforces that it
  # imports no internal package and stays a minimal, self-contained probe.
  cmd_healthcheck:
    anyVendorDeps: true

  local_rnd:
    anyProjectDeps: true
    anyVendorDeps: true
